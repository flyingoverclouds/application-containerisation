apiVersion: v1
kind: Namespace
metadata:
  name: demonamespace
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: testpod
  name: testpod
  namespace: demonamespace
spec:
  containers:
  - image: nginx
    name: testpod
  dnsPolicy: ClusterFirst
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: testpodsvc
  name: testpodsvc
  namespace: demonamespace
spec:
  type: LoadBalancer
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    run: testpod
